draw:
  name: Draw composited layout
  description: Draw a complex layout on the SoundBridge display using a list of items (text, icon, native primitives).
  target:
    entity:
      integration: roku_soundbridge
      domain: media_player
  fields:
    clear:
      name: Clear before drawing
      description: Clear the display before drawing the new layout.
      default: true
      required: false
      selector:
        boolean:
    items:
      name: Items
      description: List of items to draw.
      required: true
      selector:
        object:

clear_display:
  name: Clear display
  description: Clear the SoundBridge display.
  target:
    entity:
      integration: roku_soundbridge
      domain: media_player

sketch_command:
  name: Sketch command
  description: Send a raw sketch sub-shell command.
  target:
    entity:
      integration: roku_soundbridge
      domain: media_player
  fields:
    command:
      name: Command
      description: Sketch command (e.g., 'rect 0 0 100 20').
      example: "rect 0 0 100 20"
      required: true
      selector:
        text:

send_command:
  name: Send command
  description: Send a raw RCP command.
  target:
    entity:
      integration: roku_soundbridge
      domain: media_player
  fields:
    command:
      name: Command
      description: RCP command string.
      example: "SetPowerState on"
      required: true
      selector:
        text:

play_preset:
  name: Play preset
  description: Play a specific radio preset by index or name (e.g., A1-A6, B1-B6, or 0-17).
  target:
    entity:
      integration: roku_soundbridge
      domain: media_player
  fields:
    preset:
      name: Preset
      description: The preset index (e.g. 0) or ID token (e.g. A1, B3).
      example: "A1"
      required: true
      selector:
        text:
